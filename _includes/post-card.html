<article class="card">
  <h2 class="card__title">
    <a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a>
  </h2>
  {%- include post-meta.html post=include.post -%}
  <div class="card__excerpt">
    {{ include.post.excerpt | strip_html | truncatewords: 45 }}
  </div>
  <p class="card__more"><a href="{{ include.post.url | relative_url }}">Continua a leggere<span class="sr-only"> {{ include.post.title | escape }}</span> &rarr;</a></p>
</article>
