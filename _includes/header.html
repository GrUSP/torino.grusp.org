{%- assign logo_file = site.static_files | where: "path", site.logo | first -%}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      {%- if logo_file %}
      <img class="site-brand__logo" src="{{ site.logo | relative_url }}" alt="" width="48" height="48" loading="lazy">
      {%- endif %}
      <span class="site-brand__text">
        <span class="site-brand__title">{{ site.title }}</span>
        <span class="site-brand__tagline">{{ site.tagline }}</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Navigazione principale">
      <ul>
        {%- for item in site.data.navigation -%}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor -%}
      </ul>
    </nav>
  </div>
</header>
