<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p class="site-footer__about">
      <strong>{{ site.title }}</strong><br>
      {{ site.description | strip_newlines | truncate: 180 }}
    </p>
    <ul class="site-footer__links">
      <li><a href="{{ site.social.meetup }}">Meetup</a></li>
      <li><a href="{{ site.social.grusp }}">GrUSP</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">Feed RSS</a></li>
      <li><a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></li>
    </ul>
        <p class="site-footer__legal">
      <span class="site-footer__legal-text">
        &copy; {{ site.time | date: '%Y' }} {{ site.title }} &middot;
        Sito statico generato con <a href="https://jekyllrb.com/">Jekyll</a> e ospitato su GitHub Pages.
      </span>
      <button type="button" class="theme-toggle" id="theme-toggle" data-theme-state="system" hidden>
        <svg class="theme-toggle__icon theme-toggle__icon--system" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <rect x="2.5" y="4" width="19" height="13" rx="1.5"></rect>
          <path d="M8.5 20.5h7M12 17v3.5"></path>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--light" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.25"></circle>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M19.07 4.93L17.3 6.7M6.7 17.3l-1.77 1.77"></path>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--dark" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <path d="M20.5 14.3A8.8 8.8 0 0 1 9.7 3.5a8.8 8.8 0 1 0 10.8 10.8z"></path>
        </svg>
        <span class="sr-only" data-theme-label>Tema: automatico, come il sistema</span>
      </button>
    </p>
  </div>
</footer>
