name: Build e deploy su GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; non annulla un deploy già in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Il builder classico di Pages (sorgente "Deploy from a branch") compila
      # senza il baseurl del sito di anteprima: pubblicherebbe pagine con CSS e
      # link rotti, in gara con questo workflow. Forziamo la sorgente.
      - name: Sorgente Pages = GitHub Actions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "Sorgente Pages impostata su GitHub Actions."
          else
            echo "::warning::Non sono riuscito a impostare la sorgente Pages. Impostala a mano da Settings -> Pages -> Source: GitHub Actions, altrimenti il builder classico continua a pubblicare il sito senza baseurl (CSS e link rotti)."
          fi

      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          # Attiva GitHub Pages (source: GitHub Actions) al primo run, senza
          # doverlo fare a mano da Settings -> Pages.
          enablement: true

      - name: Build del sito
        env:
          JEKYLL_ENV: production
        # Nessun --baseurl: lo definisce _config.yml, così la build in CI, quella
        # nelle PR e quella in locale producono esattamente gli stessi link.
        run: bundle exec jekyll build

      - name: Verifica delle URL migrate da WordPress
        run: bash tools/verify_build.sh

      - name: Verifica del rendering di tutte le pagine
        run: python3 tools/check_render.py _site

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
